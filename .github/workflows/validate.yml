name: validate

# user-lex.csv の検査。**Release の差し替え（release-user-lex）はマージの後なので、
# ここを通っていない行は HENGE に届かない。** 誤読回帰の本検査もここで行う
# （もとは HENGE の CI にあり、Release の差し替えと本番の再読みより後に走っていた）。
on:
  push:
    branches: [main]
    paths: ["user-lex.csv", "scripts/**", "collateral-allow.tsv"]
  pull_request:
    paths: ["user-lex.csv", "scripts/**", "collateral-allow.tsv"]

jobs:
  user-lex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 語彙の巻き込みチェックで、PR の base の user-lex.csv と比べる
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: 構文（13列・整数・カタカナ読み）
        run: bun scripts/validate-user-lex.ts

      - name: システム辞書を取得
        run: bun scripts/fetch-dict.ts

      - name: 誤読回帰（直したい読みになるか・複合語を壊さないか）
        run: bun test

      # 増えた行が、その表層を含む辞書の語の読みを変えないか（#19）
      - name: 語彙の巻き込み
        if: github.event_name == 'pull_request'
        run: bun scripts/check-collateral.ts --base "origin/${{ github.base_ref }}"
