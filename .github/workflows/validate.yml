name: validate

on:
  push:
    paths: ["user-lex.csv", "scripts/validate-user-lex.ts"]
  pull_request:
    paths: ["user-lex.csv"]

jobs:
  user-lex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun scripts/validate-user-lex.ts
