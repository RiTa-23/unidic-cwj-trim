name: apply-reports

# HENGEの承認済み読み違い報告を user-lex.csv に反映する自動PRワークフロー（#200）。
# 手動起動（報告を承認した直後）か日次cronで走る。
#
# **PR は1本だけ持つ。** ブランチは `bot/user-lex` に固定し、実行のたびに main と
# 承認済みの報告から作り直して force-push する。開いている PR があれば更新し、
# 承認済みが無くなれば閉じる。こうしないと、マージ待ちのあいだ毎日同じ行で PR が
# 増え（#21・#22）、HENGE で承認を取り消した行も開いている PR に残り続ける。
# PR がマージされると release-user-lex が HENGE 側の報告を applied に閉じる。

on:
  workflow_dispatch:
  schedule:
    # 毎日 20:45 UTC（JST 5:45）に承認済みがあれば拾う。
    # 毎時00分・00:00 UTC 帯は GitHub Actions の schedule が最も混雑して
    # 大幅な遅延・スキップが起きるため、空いている時刻にずらしている。
    - cron: "45 20 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      # **main から作り直す。** 手動起動で bot/user-lex などを選ぶと、その CSV には未マージの
      # 行が入っていて「変更なし」と判定され、必要な PR を閉じてしまう。
      # 履歴は全部取る。浅いクローンだと main の過去のコミットが bot ブランチ側にだけ
      # 見え、人のコミットと取り違える
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # 追記の前に実行すること。ローカルで追記した行がcsvに「存在する」扱いに
      # なり、未マージの報告を誤って適用完了に閉じるのを防ぐため。
      - name: HENGE側の適用完了を同期
        env:
          HENGE_ORIGIN: ${{ vars.HENGE_ORIGIN }}
          REPORTS_SYNC_TOKEN: ${{ secrets.REPORTS_SYNC_TOKEN }}
        run: bun scripts/apply-reports.ts --mark-applied-only

      # 実測コスト探索（#12）用にシステム辞書を Release 資産から取得。
      # wasm pkg は vendor/reading-wasm-pkg にリポジトリ同梱済み。
      - name: システム辞書（UniDic trim）を取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download unidic-cwj-trim-v2 -p 'unidic-cwj-v3.dic.zst' -D /tmp/dict --clobber

      - name: 承認済み報告を user-lex.csv に追記
        env:
          HENGE_ORIGIN: ${{ vars.HENGE_ORIGIN }}
          REPORTS_SYNC_TOKEN: ${{ secrets.REPORTS_SYNC_TOKEN }}
          UNIDIC_DIC_PATH: /tmp/dict/unidic-cwj-v3.dic.zst
          READING_WASM_PKG_DIR: vendor/reading-wasm-pkg
        run: bun scripts/apply-reports.ts

      - name: 構文検証
        run: bun scripts/validate-user-lex.ts

      - name: 変更がなければ終了
        id: check
        run: |
          if git diff --quiet user-lex.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # **PR の CI に任せず、push の前にここで validate と同じ検査をかける。**
      # Actions のトークンで作った PR・push では validate が自動で走らない（#21・#22 は
      # ジョブ0件のまま終わり、#20 以前は手で再実行していた）。main は保護していないので、
      # 検査されていない bot PR をそのままマージできてしまう。
      # apply-reports.ts の巻き込みチェックは1行ずつなので、追加した行どうしの組み合わせは
      # ここ（check-collateral）で初めて見る。落ちたら push しない。
      - name: 誤読回帰（直したい読みになるか・複合語を壊さないか）
        if: steps.check.outputs.changed == 'true'
        env:
          UNIDIC_DIC_PATH: /tmp/dict/unidic-cwj-v3.dic.zst
        run: bun test

      - name: 語彙の巻き込み（追加した行をまとめて）
        if: steps.check.outputs.changed == 'true'
        env:
          UNIDIC_DIC_PATH: /tmp/dict/unidic-cwj-v3.dic.zst
        run: bun scripts/check-collateral.ts --base origin/main

      - name: user-lex 更新PRを作り直す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          set -euo pipefail
          branch="bot/user-lex"
          bot_email="github-actions[bot]@users.noreply.github.com"
          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')
          # いまのブランチの先頭。push はこの値を前提にする（無ければ空＝ブランチが無い前提）
          remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)

          # 開いている PR に人がコミットしていたら上書きしない（#17 の手直しのようなケース）。
          # 「Update branch」のマージコミットは数えない。PR を閉じた後のブランチは古いものとして作り直す
          if [ -n "$pr" ] && [ -n "$remote_sha" ]; then
            git fetch -q origin "$branch"
            humans=$(git log --no-merges --format='%ae' "origin/main..$remote_sha" | grep -vxF "$bot_email" || true)
            if [ -n "$humans" ]; then
              echo "::warning::PR #$pr（$branch）に人のコミットがあるため作り直さない。マージするか閉じると自動更新が再開する"
              exit 0
            fi
          fi

          if [ "$CHANGED" != "true" ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch \
                --comment "承認済みで未反映の報告が無くなったため閉じる（取り消し・却下・反映済み）。次に承認されたら作り直す。"
            fi
            exit 0
          fi

          n=$(cat /tmp/user-lex-new-count)
          title="feat: 読み違い報告を user-lex.csv に反映（${n}行）"
          git config user.name "github-actions[bot]"
          git config user.email "$bot_email"
          git checkout -B "$branch"
          git add user-lex.csv
          git commit -q -m "$title" -m "HENGEの承認済み報告を自動転記。apply-reports が実行のたびに作り直す。"
          # 上の確認のあとに人が push していたら、上書きせずに失敗させる
          git push -q --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file /tmp/user-lex-pr-body.md
          else
            gh pr create --head "$branch" --base main --title "$title" --body-file /tmp/user-lex-pr-body.md
          fi
