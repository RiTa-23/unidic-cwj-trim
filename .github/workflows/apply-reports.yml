name: apply-reports

# HENGEの承認済み読み違い報告を user-lex.csv に反映する自動PRワークフロー（#200）。
# 手動起動（報告を承認した直後）か日次cronで走る。
#
# **PR は1本だけ持つ。** ブランチは `bot/user-lex` に固定し、実行のたびに main と
# 承認済みの報告から作り直して force-push する。開いている PR があれば更新し、
# 承認済みが無くなれば閉じる。こうしないと、マージ待ちのあいだ毎日同じ行で PR が
# 増え（#21・#22）、HENGE で承認を取り消した行も開いている PR に残り続ける。
# PR がマージされると release-user-lex が HENGE 側の報告を applied に閉じる。

on:
  workflow_dispatch:
  schedule:
    # 毎日 20:45 UTC（JST 5:45）に承認済みがあれば拾う。
    # 毎時00分・00:00 UTC 帯は GitHub Actions の schedule が最も混雑して
    # 大幅な遅延・スキップが起きるため、空いている時刻にずらしている。
    - cron: "45 20 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # 追記の前に実行すること。ローカルで追記した行がcsvに「存在する」扱いに
      # なり、未マージの報告を誤って適用完了に閉じるのを防ぐため。
      - name: HENGE側の適用完了を同期
        env:
          HENGE_ORIGIN: ${{ vars.HENGE_ORIGIN }}
          REPORTS_SYNC_TOKEN: ${{ secrets.REPORTS_SYNC_TOKEN }}
        run: bun scripts/apply-reports.ts --mark-applied-only

      # 実測コスト探索（#12）用にシステム辞書を Release 資産から取得。
      # wasm pkg は vendor/reading-wasm-pkg にリポジトリ同梱済み。
      - name: システム辞書（UniDic trim）を取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download unidic-cwj-trim-v1 -p 'unidic-cwj-*.dic.zst' -D /tmp/dict --clobber

      - name: 承認済み報告を user-lex.csv に追記
        env:
          HENGE_ORIGIN: ${{ vars.HENGE_ORIGIN }}
          REPORTS_SYNC_TOKEN: ${{ secrets.REPORTS_SYNC_TOKEN }}
          UNIDIC_DIC_PATH: /tmp/dict/unidic-cwj-v7800n-slim2.dic.zst
          READING_WASM_PKG_DIR: vendor/reading-wasm-pkg
        run: bun scripts/apply-reports.ts

      - name: 構文検証
        run: bun scripts/validate-user-lex.ts

      - name: 変更がなければ終了
        id: check
        run: |
          if git diff --quiet user-lex.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: user-lex 更新PRを作り直す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          set -euo pipefail
          branch="bot/user-lex"
          bot_email="github-actions[bot]@users.noreply.github.com"
          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')

          # 人がこのブランチにコミットしていたら上書きしない（#17 の手直しのようなケース）。
          # 「Update branch」のマージコミットは数えない
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch -q origin "$branch"
            humans=$(git log --no-merges --format='%ae' "origin/main..origin/$branch" | grep -vxF "$bot_email" || true)
            if [ -n "$humans" ]; then
              echo "::warning::$branch に人のコミットがあるため作り直さない。PR #${pr:-?} をマージするか閉じると自動更新が再開する"
              exit 0
            fi
          fi

          if [ "$CHANGED" != "true" ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch \
                --comment "承認済みで未反映の報告が無くなったため閉じる（取り消し・却下・反映済み）。次に承認されたら作り直す。"
            fi
            exit 0
          fi

          n=$(cat /tmp/user-lex-new-count)
          title="feat: 読み違い報告を user-lex.csv に反映（${n}行）"
          git config user.name "github-actions[bot]"
          git config user.email "$bot_email"
          git checkout -B "$branch"
          git add user-lex.csv
          git commit -q -m "$title" -m "HENGEの承認済み報告を自動転記。apply-reports が実行のたびに作り直す。"
          git push -q --force origin "$branch"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file /tmp/user-lex-pr-body.md
          else
            gh pr create --head "$branch" --base main --title "$title" --body-file /tmp/user-lex-pr-body.md
          fi
