name: release-user-lex

# user-lex.csv が main にマージされたら Release アセットを差し替える。
# HENGEは `dict:fetch` でこのアセットを取るので、ここを更新しないと
# 本番の読みWorkerは古いユーザー辞書を使い続ける。
# 検査（validate: 構文・誤読回帰・語彙の巻き込み）は PR の時点で済んでいる。

on:
  push:
    branches: [main]
    paths: ["user-lex.csv"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release アセットを差し替え
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # HENGE は辞書・user-lex・ライセンス文を同じタグから取る（scripts/unidic/fetch-dict.ts）。
        # ライセンス文は変わらないが、新しいタグに確実に揃えるため毎回上げる
        run: gh release upload unidic-cwj-trim-v4 user-lex.csv COPYING.unidic LICENSE-BSD.unidic AUTHORS.unidic --clobber

      # マージされた時点で報告の「適用完了」をHENGE側に通知する。
      # csv が main に入った = 適用済みなので、apply-reports の再実行を
      # 待たずにこのワークフロー内で閉じる（冪等: 対象が無ければ何もしない）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: HENGE側の報告を適用完了に更新
        env:
          HENGE_ORIGIN: ${{ vars.HENGE_ORIGIN }}
          REPORTS_SYNC_TOKEN: ${{ secrets.REPORTS_SYNC_TOKEN }}
        run: bun scripts/apply-reports.ts --mark-applied-only

      # HENGEは dict:fetch でアセットを取って読みWorkerに同梱するので、
      # アセット更新だけでは本番に届かない。Deployを起動して取り込ませる。
      # **既存お題の再読みは Deploy に任せる**（reread: true）。Deploy は CI とデプロイが
      # 通ってから再読みを呼ぶので、読み Worker が壊れた辞書で本番 D1 を書き換えない。
      # 以前は再読みを Deploy と同時に別で起動しており、CI より先に走っていた。
      # HENGE_DEPLOY_TOKEN = HENGEリポに Actions:write を持つ fine-grained PAT。
      - name: HENGE の Deploy（デプロイ後に既存お題を再読み）を起動
        env:
          GH_TOKEN: ${{ secrets.HENGE_DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml --repo RiTa-23/HENGE --ref main -f reread=true
