name: release-user-lex

# user-lex.csv が main にマージされたら Release アセットを差し替える。
# HENGEは `dict:fetch` でこのアセットを取るので、ここを更新しないと
# 本番の読みWorkerは古いユーザー辞書を使い続ける。
# アセット差し替え後にHENGE側を再デプロイ（Deployワークフローを手動起動 or 次回push）して反映。

on:
  push:
    branches: [main]
    paths: ["user-lex.csv"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release アセットを差し替え
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload unidic-cwj-trim-v1 user-lex.csv --clobber

      # マージされた時点で報告の「適用完了」をHENGE側に通知する。
      # csv が main に入った = 適用済みなので、apply-reports の再実行を
      # 待たずにこのワークフロー内で閉じる（冪等: 対象が無ければ何もしない）。
      - uses: oven-sh/setup-bun@v2

      - name: HENGE側の報告を適用完了に更新
        env:
          HENGE_ORIGIN: ${{ vars.HENGE_ORIGIN }}
          REPORTS_SYNC_TOKEN: ${{ secrets.REPORTS_SYNC_TOKEN }}
        run: bun scripts/apply-reports.ts --mark-applied-only

      # HENGEは dict:fetch でアセットを取って読みWorkerに同梱するので、
      # アセット更新だけでは本番に届かない。Deployを起動して取り込ませる。
      # HENGE_DEPLOY_TOKEN = HENGEリポに Actions:write を持つ fine-grained PAT。
      - name: HENGE の Deploy を起動
        env:
          GH_TOKEN: ${{ secrets.HENGE_DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml --repo RiTa-23/HENGE --ref main

      # 既存お題の reading_kana は生成時点で凍結されるので、新しいアセットで
      # 再読みして prod D1 を更新するバッチも起動する（差分のみ適用・冪等）。
      - name: HENGE の既存お題再読みを起動
        env:
          GH_TOKEN: ${{ secrets.HENGE_DEPLOY_TOKEN }}
        run: gh workflow run reread-prompts.yml --repo RiTa-23/HENGE --ref main
